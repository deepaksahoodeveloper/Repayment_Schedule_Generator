<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanCard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
</head>


<body>
    <main class="container">
        <section class="intro">
            <span class="eyebrow">LOAN CARD GENERATOR</span>
            <h1>Choose a loan type</h1>
            <p>Select a loan type to get started.</p>
        </section>

        <section class="loan-grid" id="loanTypes" aria-label="Loan types" >

            <!-- Custom -->
            <a href="./pages/001-custom-loan-input.html" class="loan-card" >
                <div class="loan-icon">
                    <i data-lucide="plus"></i>
                </div>
                <div class="loan-info">
                    <h2>Custom Loan</h2>
                    <p>Create any other loan card</p>
                </div>
                <i data-lucide="arrow-up-right" class="arrow"></i>
            </a>
            
        </section>

    </main>

    <script src="./js/pages/index.js"></script>

</body>

</html>
